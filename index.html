والحجز والفاتورة، ثم استخدم قناة الشكاوى الرسمية.","requirements":"بيانات المرفق + الحجز + صور/أدلة عدم المطابقة + وصف الخدمة المعلنة.","what_happens_next":"يمكن للوزارة التعامل مع البلاغ ضمن رقابتها على مرافق وأنشطة الضيافة السياحية.","ui_current_situation":"الخدمة أو النظافة أو المرفق ما يطابق المعروض أو المتوقع من تصنيفه.","ui_action_required":"وثّق عدم المطابقة وارفع بلاغًا عند عدم المعالجة","ui_next_step":"اطلب المعالجة من المرفق أولًا واحتفظ بالأدلة ثم استخدم قناة وزارة السياحة.","ui_requirements":"الحجز + وصف المعروض + صور/أدلة + الفاتورة.","ui_what_happens_next":"يُتعامل مع البلاغ رقابيًا وفق اختصاص الوزارة.","ui_official_source":"وزارة السياحة — حقوق وواجبات السائح","ui_caution":"التصنيف الرقابي للمرفق لا يعني تلقائيًا ثبوت مطالبة مالية محددة."}],"rules":[{"meaning":"نوع العلاقة لا يحدد الاختصاص تلقائيًا.","rule":"RELATIONSHIP ≠ JURISDICTION","rule_id":"RULE-001","status":"active"},{"meaning":"وجود شركة لا يعني تلقائيًا أن المسار تجاري.","rule":"COMPANY ≠ COMMERCIAL COURT","rule_id":"RULE-002","status":"active"},{"meaning":"عدم السداد وحده لا يعني احتيالًا.","rule":"NONPAYMENT ≠ FRAUD","rule_id":"RULE-003","status":"active"},{"meaning":"المهلة الحرجة تُفحص قبل اقتراح أي خطوة تالية.","rule":"DEADLINE > NEXT ACTION","rule_id":"RULE-004","status":"active"},{"meaning":"في المسار الجنائي: الصفة والمرحلة قبل نوع الجريمة.","rule":"ROLE + STAGE FIRST","rule_id":"RULE-005","status":"active"},{"meaning":"حالة القضية تختلف عن حالة الطلب داخل القضية.","rule":"CASE_STATUS ≠ REQUEST_STATUS","rule_id":"RULE-006","status":"active"},{"meaning":"طلب التنفيذ يختلف عن إجراء التنفيذ.","rule":"EXEC_REQUEST ≠ EXEC_ACTION","rule_id":"RULE-007","status":"active"},{"meaning":"العقد لا يُعامل كسند تنفيذي تلقائيًا.","rule":"CONTRACT ≠ EXEC_INSTRUMENT","rule_id":"RULE-008","status":"active"},{"meaning":"إذا لا يوجد نزاع فلا نصنع دعوى؛ قد يكون توثيقًا أو خدمة أو صلحًا.","rule":"NO DISPUTE ≠ CASE","rule_id":"RULE-009","status":"active"},{"meaning":"المحرك يوجّه إجرائيًا ولا يقدم رأيًا قانونيًا أو استراتيجية.","rule":"AI EXTRACTS, DOES NOT DECIDE","rule_id":"RULE-010","status":"active"},{"meaning":"إذا ظهر رقم 34 أو 46 في ناجز فلا نحدد أثره من الرقم وحده؛ نفحص اسم الإجراء وحالته وتفاصيله.","rule":"DO NOT INFER FROM 34/46","rule_id":"RULE-011","status":"active"},{"meaning":"خدمات إثبات السداد والإمهال والتحويل تعتمد على حالة طلب التنفيذ وشروط الخدمة؛ نفحص الطلب القائم أولًا.","rule":"ACTIVE EXECUTION BEFORE SIDE SERVICE","rule_id":"RULE-012","status":"active"},{"meaning":"خدمة إضافة وارث تخص طلبات تنفيذ المتوفى بصفته طالب تنفيذ وفق شروط الخدمة؛ الحالات الأخرى تحتاج مسارًا مختلفًا.","rule":"HEIR ROLE MATTERS","rule_id":"RULE-013","status":"active"},{"meaning":"إذا طلبت الدائرة مذكرة نحدد الخدمة الإجرائية؛ أما ماذا يكتب المستخدم من دفوع أو استراتيجية فيحال لمختص.","rule":"WRITTEN REQUEST ≠ LEGAL STRATEGY","rule_id":"RULE-014","status":"active"},{"meaning":"الاستئناف والنقض والتماس إعادة النظر مسارات مختلفة ولا تُدمج في خيار واحد.","rule":"APPEAL ≠ CASSATION ≠ RECONSIDERATION","rule_id":"RULE-015","status":"active"},{"meaning":"اعتراض الخصم لا يعني تلقائيًا أن المستخدم يجب أن يقدم اعتراضًا جديدًا؛ يفحص ما إذا طُلب منه رد أو إجراء.","rule":"OPPONENT APPEAL ≠ USER MUST FILE APPEAL","rule_id":"RULE-016","status":"active"},{"meaning":"صدور حكم لا يعني تلقائيًا أن التنفيذ متاح الآن؛ تُفحص حالة الحكم وقابليته للتنفيذ.","rule":"JUDGMENT ≠ EXECUTABLE NOW","rule_id":"RULE-017","status":"active"},{"meaning":"التماس إعادة النظر ليس بديلًا عامًا للاستئناف؛ يحتاج تحققًا من سبب وحالة نظامية مناسبة.","rule":"RECONSIDERATION IS EXCEPTIONAL","rule_id":"RULE-018","status":"active"},{"meaning":"العلاقة العمالية الخاصة والعمالة المنزلية والوظيفة الحكومية لا تدخل في مسار إجرائي واحد.","rule":"PRIVATE ≠ DOMESTIC ≠ GOVERNMENT LABOR","rule_id":"RULE-019","status":"active"},{"meaning":"التسوية الودية هي المرحلة الأولى في الخلافات العمالية الخاصة قبل الانتقال للمحكمة العمالية عند تعذر الصلح وفق الإجراء الرسمي.","rule":"PRIVATE LABOR SETTLEMENT FIRST","rule_id":"RULE-020","status":"active"},{"meaning":"خلافات العمالة المنزلية لها قواعد وإجراءات تسوية ودية خاصة منشورة في 2026 قبل الإحالة للمحكمة العمالية.","rule":"DOMESTIC WORKER HAS SPECIAL SETTLEMENT RULES","rule_id":"RULE-021","status":"active"},{"meaning":"نزاع الموظف الحكومي الإداري لا يُعامل كدعوى عمالية خاصة؛ يُوجّه لمسار القضاء الإداري/منصة معين بحسب حالته.","rule":"GOVERNMENT EMPLOYEE → ADMINISTRATIVE ROUTE","rule_id":"RULE-022","status":"active"},{"meaning":"إذا لا يوجد نزاع نبحث أولًا عن خدمة توثيق مناسبة، ولا نصنع دعوى قضائية بلا حاجة.","rule":"NO DISPUTE DOCUMENTATION ≠ FAMILY LITIGATION","rule_id":"RULE-023","status":"active"},{"meaning":"توثيق الحضانة في ناجز مخصص لحالات محددة ويشترط عدم وجود نزاع على الحضانة.","rule":"CUSTODY DOCUMENTATION REQUIRES NO DISPUTE","rule_id":"RULE-024","status":"active"},{"meaning":"خدمة الزيارة الحالية في ناجز تنفيذية لحكم زيارة قائم؛ لا نختلق خدمة توثيق زيارة مستقلة.","rule":"VISIT SERVICE IS EXECUTION OF A JUDGMENT","rule_id":"RULE-025","status":"active"},{"meaning":"مطالبة النفقة قبل الحكم تختلف عن تنفيذ حكم نفقة قائم، والنفقة المستقبلية لها إجراء تنفيذ استقطاع عند انطباقه.","rule":"MAINTENANCE CLAIM ≠ MAINTENANCE EXECUTION","rule_id":"RULE-026","status":"active"},{"meaning":"عند وجود نزاع أسري بلا حكم نمر ببوابة الصلح/الدعوى المناسبة قبل التنفيذ.","rule":"FAMILY DISPUTE BEFORE JUDGMENT","rule_id":"RULE-027","status":"active"},{"meaning":"العقار ليس مسارًا واحدًا؛ يجب فصل الإيجار، الملكية/الحيازة، التسجيل العيني، الشيوع/القسمة، والرهن/التمويل.","rule":"REAL ESTATE NEEDS ROUTE SPLIT","rule_id":"RULE-028","status":"active"},{"meaning":"العقد الموحد الموثق في إيجار يحمل صفة السند التنفيذي، لكن لا نعامل كل نزاع ناشئ عنه كتنفيذ تلقائي.","rule":"EJAR STANDARD CONTRACT HAS EXECUTIVE FORCE","rule_id":"RULE-029","status":"active"},{"meaning":"حتى مع عقد إيجار موحد يجب التحقق أن المطالبة المحددة تقع ضمن الالتزام القابل للتنفيذ، وإلا ينتقل المسار للنزاع القضائي المناسب.","rule":"EXECUTIVE INSTRUMENT SCOPE MATTERS","rule_id":"RULE-030","status":"active"},{"meaning":"منازعات الملكية والحقوق المتصلة بالعقار والضرر والحيازة وما شابه تدخل أصلًا في اختصاص المحاكم العامة ما لم يوجد نص خاص.","rule":"GENERAL COURT HANDLES CORE PROPERTY DISPUTES","rule_id":"RULE-031","status":"active"},{"meaning":"اتفاق الشركاء على الفرز/القسمة مسار إجرائي مختلف عن النزاع بين الشركاء على أصل الحق أو القسمة.","rule":"AGREEMENT ≠ CO-OWNERSHIP DISPUTE","rule_id":"RULE-032","status":"active"},{"meaning":"خدمات السجل العقاري العيني ترتبط بالعقار والمناطق المعلنة وحالة تسجيله؛ نفحص ذلك قبل اختيار خدمة التسجيل.","rule":"REGISTRY AREA GATE","rule_id":"RULE-033","status":"active"},{"meaning":"فك الرهن أو توثيقه خدمة عقارية، أما الخلاف مع جهة التمويل فينتقل لجهة/مسار نزاع التمويل لا إلى التسجيل العقاري وحده.","rule":"MORTGAGE DOCUMENTATION ≠ FINANCE DISPUTE","rule_id":"RULE-034","status":"active"},{"meaning":"وجود شركة أو مؤسسة لا يكفي وحده؛ نحدد طبيعة العلاقة والعمل محل النزاع قبل اختيار الاختصاص.","rule":"COMPANY INVOLVED ≠ AUTOMATIC COMMERCIAL COURT","rule_id":"RULE-035","status":"active"},{"meaning":"الفاتورة أو المطالبة التجارية وحدها لا تعامل تلقائيًا كسند تنفيذي؛ نتحقق من وجود سند تنفيذي مستقل.","rule":"INVOICE ≠ EXECUTION INSTRUMENT","rule_id":"RULE-036","status":"active"},{"meaning":"المطالبة المالية قد تكون تجارية أو عمالية أو عقارية أو تمويلية؛ أصل العلاقة يحدد المسار.","rule":"RELATIONSHIP CONTROLS ROUTE","rule_id":"RULE-037","status":"active"},{"meaning":"الخلاف بين الشركاء لا يصبح جريمة لمجرد عدم السداد أو سوء الإدارة؛ يلزم فصل وقائع الخداع/الاستيلاء المستقلة.","rule":"PARTNER DISPUTE ≠ FRAUD","rule_id":"RULE-038","status":"active"},{"meaning":"الإفلاس وإعادة التنظيم والتصفية مسارات نظامية مستقلة عن دعوى المطالبة العادية.","rule":"BANKRUPTCY IS A SEPARATE ROUTE","rule_id":"RULE-039","status":"active"},{"meaning":"الشيك والسند لأمر والكمبيالة قد تدخل التنفيذ إذا استوفت المتطلبات؛ النزاع على صحتها لا يُختزل في فتح تنفيذ.","rule":"NEGOTIABLE INSTRUMENT NEEDS REQUIREMENTS CHECK","rule_id":"RULE-040","status":"active"},{"meaning":"وجود اتفاق تحكيم قد يغير بوابة النزاع؛ حكم التحكيم له تنفيذ وبطلان وفق مسارات مختلفة وليس استئنافًا عاديًا.","rule":"ARBITRATION CLAUSE ≠ COURT FIRST","rule_id":"RULE-041","status":"active"},{"meaning":"قيد الامتياز وتعديله وإلغاؤه خدمة لدى وزارة التجارة، أما النزاع العقدي فيحتاج مسار نزاع مستقل.","rule":"FRANCHISE REGISTRATION ≠ FRANCHISE DISPUTE","rule_id":"RULE-042","status":"active"},{"meaning":"العلامات وحقوق المؤلف والبراءات والتصاميم لها خدمات تسجيل وإدارة وإنفاذ مختلفة لدى الهيئة السعودية للملكية الفكرية.","rule":"IP IS NOT ONE ROUTE","rule_id":"RULE-043","status":"active"},{"meaning":"في الجنائي نحدد صفة المستخدم ومرحلة الإجراء قبل الغوص في نوع الجريمة، لأن الخطوة التالية تتغير جذريًا بذلك.","rule":"ROLE + STAGE BEFORE CRIME TYPE","rule_id":"RULE-044","status":"active"},{"meaning":"تقديم البلاغ لا يعني أن قضية جزائية قُيدت في المحكمة؛ قد يمر بالاستدلال والتحقيق أولًا.","rule":"REPORT ≠ CRIMINAL CASE","rule_id":"RULE-045","status":"active"},{"meaning":"مجرد عدم السداد أو الإخلال بالعقد لا يساوي احتيالًا؛ نحتاج وقائع خداع أو استيلاء مستقلة قبل بوابة البلاغ الجنائي.","rule":"NONPAYMENT ≠ FRAUD","rule_id":"RULE-046","status":"active"},{"meaning":"عند الاستدعاء نتحقق من الجهة والصفة والمرحلة؛ لا نعطي دفاعًا موضوعيًا.","rule":"SUMMONS NEEDS AUTHORITY + ROLE","rule_id":"RULE-047","status":"active"},{"meaning":"المقبوض/الموقوف يُعرّف بأسباب القبض أو التوقيف وحقه في محام والاتصال بمن يرى إبلاغه، وفق النظام واللائحة.","rule":"ARREST/DETENTION RIGHTS FIRST","rule_id":"RULE-048","status":"active"},{"meaning":"الإفراج لا يعني تلقائيًا حفظ القضية أو انتهائها؛ يجب التحقق من قرار التصرف في التحقيق أو الإحالة.","rule":"RELEASE ≠ CASE CLOSED","rule_id":"RULE-049","status":"active"},{"meaning":"إذا وصلت القضية للمحكمة، نوجّه لإجراءات الجلسة والحكم دون صياغة دفاع أو استراتيجية.","rule":"CRIMINAL COURT STAGE","rule_id":"RULE-050","status":"active"},{"meaning":"بعد الحكم نحدد حالة الحكم وطريق الاعتراض/النهائية وفق النظام بدل افتراض مسار واحد.","rule":"CRIMINAL JUDGMENT HAS OBJECTION ROUTES","rule_id":"RULE-051","status":"active"},{"meaning":"ما يجب قوله للمحقق، الاعتراف أو الإنكار، الدفوع، تقييم الأدلة، وكيفية كسب القضية: حد أحمر لمحامٍ مرخص.","rule":"NO DEFENSE STRATEGY","rule_id":"RULE-052","status":"active"},{"meaning":"في الجرائم المعلوماتية نوجّه لقناة البلاغ الرسمية ونوصي بحفظ الأدلة دون مواجهة أو دفع مبالغ للمبتز.","rule":"CYBER REPORT PRESERVE EVIDENCE","rule_id":"RULE-053","status":"active"},{"meaning":"لمن لحقه ضرر من الجريمة حق الادعاء بالحق الخاص أثناء التحقيق وفق نظام الإجراءات الجزائية، مع مراعاة المسار الإجرائي.","rule":"PRIVATE RIGHT CAN ARISE DURING INVESTIGATION","rule_id":"RULE-054","status":"active"},{"meaning":"إذا لا يوجد خصومة، نبحث عن خدمة توثيق/إجراء إلكتروني قبل تحويل المستخدم للقضاء.","rule":"NO DISPUTE → DOCUMENTATION FIRST","rule_id":"RULE-055","status":"active"},{"meaning":"إصدار الوكالة وفسخها والتحقق منها إجراءات توثيقية مستقلة عن الدعوى القضائية.","rule":"POWER OF ATTORNEY IS A DOCUMENTATION ROUTE","rule_id":"RULE-056","status":"active"},{"meaning":"إقرار السداد بين الأطراف يختلف عن إثبات السداد داخل طلب تنفيذ قائم؛ الثاني ينتقل لمسار التنفيذ.","rule":"PAYMENT ACKNOWLEDGMENT ≠ EXECUTION PROOF OF PAYMENT","rule_id":"RULE-057","status":"active"},{"meaning":"الطلاق والرجعة والحضانة والزواج قد تكون خدمات توثيق، لكن ظهور نزاع يغيّر المسار.","rule":"SOCIAL DOCUMENTATION NEEDS DISPUTE GATE","rule_id":"RULE-058","status":"active"},{"meaning":"إجراءات الورثة والوصية والوقف التوثيقية لا تُستخدم بدل الدعوى عند وجود نزاع.","rule":"HEIRS DOCUMENTATION ≠ HEIRS DISPUTE","rule_id":"RULE-059","status":"active"},{"meaning":"التسجيل والرهن ونقل الملكية إجراءات مختلفة عن نزاع الملكية أو التمويل.","rule":"PROPERTY DOCUMENTATION ≠ PROPERTY DISPUTE","rule_id":"RULE-060","status":"active"},{"meaning":"إذا ظهر اعتراض/نزاع أثناء خدمة توثيق، لا نكمل آليًا كأنها معاملة رضائية؛ نحدد مسار النزاع.","rule":"DISPUTE EMERGENCE CHANGES ROUTE","rule_id":"RULE-061","status":"active"},{"meaning":"النزاعات الإدارية والمصرفية والتمويلية والتأمينية والسوقية والضريبية والاتصالات لها بوابات وجهات متخصصة؛ لا تُرسل تلقائيًا للمحكمة العامة.","rule":"SPECIALIZED AUTHORITY BEFORE GENERAL COURT","rule_id":"RULE-062","status":"active"},{"meaning":"الدعاوى الإدارية وخدماتها القضائية تسير عبر ديوان المظالم ومنصة معين الرقمية وفق الاختصاص.","rule":"ADMINISTRATIVE DISPUTE → BOARD OF GRIEVANCES","rule_id":"RULE-063","status":"active"},{"meaning":"الشكوى الرقابية لدى البنك المركزي تختلف عن الدعوى أمام لجان المنازعات؛ كما يجب التفريق بين المصرفي والتمويلي.","rule":"BANKING/FINANCE NEEDS CORRECT COMMITTEE","rule_id":"RULE-064","status":"active"},{"meaning":"شكوى شركة التأمين لدى هيئة التأمين تختلف عن النزاع أمام لجان الفصل في المنازعات والمخالفات التأمينية.","rule":"INSURANCE COMPLAINT ≠ INSURANCE DISPUTE","rule_id":"RULE-065","status":"active"},{"meaning":"في دعاوى الحق الخاص في منازعات الأوراق المالية تُودع الشكوى لدى هيئة السوق المالية أولًا؛ ثم بعد مضي 90 يومًا من تاريخ الإيداع أو إخطار الهيئة بجواز الإيداع قبل انتهائها يمكن التقدم للجنة الفصل، ويجوز للهيئة تحديد استثناءات.","rule":"CMA COMPLAINT BEFORE CRSD","rule_id":"RULE-066","status":"active"},{"meaning":"المنازعة الزكوية/الضريبية/الجمركية تبدأ بالاعتراض لدى الهيئة بحسب الحالة، ثم التصعيد للأمانة العامة للجان عند تحقق بوابته.","rule":"ZATCA OBJECTION BEFORE GSTC ESCALATION","rule_id":"RULE-067","status":"active"},{"meaning":"شكوى الاتصالات تبدأ لدى مقدم الخدمة خلال 60 يومًا من الفاتورة/الواقعة، ثم التصعيد بعد 5 أيام دون حل أو الإغلاق بلا معالجة، وخلال 180 يومًا.","rule":"TELECOM PROVIDER FIRST + DEADLINES","rule_id":"RULE-068","status":"active"}],"sources":[{"authority":"وزارة العدل","last_verified":"2026-09-15","source_id":"SRC-MOJ-EXEC-APPLY","status":"current","title":"تقديم طلب تنفيذ","url":"https://moj.gov.sa/ar/eservices/pages/1c719954-3463-4754-85e1-1b319b937b86.aspx"},{"authority":"وزارة العدل","last_verified":"2026-09-15","source_id":"SRC-MOJ-EXEC-QUERY","status":"current","title":"استعلام عن طلب تنفيذ","url":"https://moj.gov.sa/ar/eServices/Pages/9bd2e276-3110-4e32-a
