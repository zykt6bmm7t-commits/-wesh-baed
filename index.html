ا يعني تلقائيًا أن التنفيذ متاح الآن؛ تُفحص حالة الحكم وقابليته للتنفيذ.","status":"active"},{"rule_id":"RULE-018","rule":"RECONSIDERATION IS EXCEPTIONAL","meaning":"التماس إعادة النظر ليس بديلًا عامًا للاستئناف؛ يحتاج تحققًا من سبب وحالة نظامية مناسبة.","status":"active"},{"rule_id":"RULE-019","rule":"PRIVATE ≠ DOMESTIC ≠ GOVERNMENT LABOR","meaning":"العلاقة العمالية الخاصة والعمالة المنزلية والوظيفة الحكومية لا تدخل في مسار إجرائي واحد.","status":"active"},{"rule_id":"RULE-020","rule":"PRIVATE LABOR SETTLEMENT FIRST","meaning":"التسوية الودية هي المرحلة الأولى في الخلافات العمالية الخاصة قبل الانتقال للمحكمة العمالية عند تعذر الصلح وفق الإجراء الرسمي.","status":"active"},{"rule_id":"RULE-021","rule":"DOMESTIC WORKER HAS SPECIAL SETTLEMENT RULES","meaning":"خلافات العمالة المنزلية لها قواعد وإجراءات تسوية ودية خاصة منشورة في 2026 قبل الإحالة للمحكمة العمالية.","status":"active"},{"rule_id":"RULE-022","rule":"GOVERNMENT EMPLOYEE → ADMINISTRATIVE ROUTE","meaning":"نزاع الموظف الحكومي الإداري لا يُعامل كدعوى عمالية خاصة؛ يُوجّه لمسار القضاء الإداري/منصة معين بحسب حالته.","status":"active"},{"rule_id":"RULE-023","rule":"NO DISPUTE DOCUMENTATION ≠ FAMILY LITIGATION","meaning":"إذا لا يوجد نزاع نبحث أولًا عن خدمة توثيق مناسبة، ولا نصنع دعوى قضائية بلا حاجة.","status":"active"},{"rule_id":"RULE-024","rule":"CUSTODY DOCUMENTATION REQUIRES NO DISPUTE","meaning":"توثيق الحضانة في ناجز مخصص لحالات محددة ويشترط عدم وجود نزاع على الحضانة.","status":"active"},{"rule_id":"RULE-025","rule":"VISIT SERVICE IS EXECUTION OF A JUDGMENT","meaning":"خدمة الزيارة الحالية في ناجز تنفيذية لحكم زيارة قائم؛ لا نختلق خدمة توثيق زيارة مستقلة.","status":"active"},{"rule_id":"RULE-026","rule":"MAINTENANCE CLAIM ≠ MAINTENANCE EXECUTION","meaning":"مطالبة النفقة قبل الحكم تختلف عن تنفيذ حكم نفقة قائم، والنفقة المستقبلية لها إجراء تنفيذ استقطاع عند انطباقه.","status":"active"},{"rule_id":"RULE-027","rule":"FAMILY DISPUTE BEFORE JUDGMENT","meaning":"عند وجود نزاع أسري بلا حكم نمر ببوابة الصلح/الدعوى المناسبة قبل التنفيذ.","status":"active"},{"rule_id":"RULE-028","rule":"REAL ESTATE NEEDS ROUTE SPLIT","meaning":"العقار ليس مسارًا واحدًا؛ يجب فصل الإيجار، الملكية/الحيازة، التسجيل العيني، الشيوع/القسمة، والرهن/التمويل.","status":"active"},{"rule_id":"RULE-029","rule":"EJAR STANDARD CONTRACT HAS EXECUTIVE FORCE","meaning":"العقد الموحد الموثق في إيجار يحمل صفة السند التنفيذي، لكن لا نعامل كل نزاع ناشئ عنه كتنفيذ تلقائي.","status":"active"},{"rule_id":"RULE-030","rule":"EXECUTIVE INSTRUMENT SCOPE MATTERS","meaning":"حتى مع عقد إيجار موحد يجب التحقق أن المطالبة المحددة تقع ضمن الالتزام القابل للتنفيذ، وإلا ينتقل المسار للنزاع القضائي المناسب.","status":"active"},{"rule_id":"RULE-031","rule":"GENERAL COURT HANDLES CORE PROPERTY DISPUTES","meaning":"منازعات الملكية والحقوق المتصلة بالعقار والضرر والحيازة وما شابه تدخل أصلًا في اختصاص المحاكم العامة ما لم يوجد نص خاص.","status":"active"},{"rule_id":"RULE-032","rule":"AGREEMENT ≠ CO-OWNERSHIP DISPUTE","meaning":"اتفاق الشركاء على الفرز/القسمة مسار إجرائي مختلف عن النزاع بين الشركاء على أصل الحق أو القسمة.","status":"active"},{"rule_id":"RULE-033","rule":"REGISTRY AREA GATE","meaning":"خدمات السجل العقاري العيني ترتبط بالعقار والمناطق المعلنة وحالة تسجيله؛ نفحص ذلك قبل اختيار خدمة التسجيل.","status":"active"},{"rule_id":"RULE-034","rule":"MORTGAGE DOCUMENTATION ≠ FINANCE DISPUTE","meaning":"فك الرهن أو توثيقه خدمة عقارية، أما الخلاف مع جهة التمويل فينتقل لجهة/مسار نزاع التمويل لا إلى التسجيل العقاري وحده.","status":"active"},{"rule_id":"RULE-035","rule":"COMPANY INVOLVED ≠ AUTOMATIC COMMERCIAL COURT","meaning":"وجود شركة أو مؤسسة لا يكفي وحده؛ نحدد طبيعة العلاقة والعمل محل النزاع قبل اختيار الاختصاص.","status":"active"},{"rule_id":"RULE-036","rule":"INVOICE ≠ EXECUTION INSTRUMENT","meaning":"الفاتورة أو المطالبة التجارية وحدها لا تعامل تلقائيًا كسند تنفيذي؛ نتحقق من وجود سند تنفيذي مستقل.","status":"active"},{"rule_id":"RULE-037","rule":"RELATIONSHIP CONTROLS ROUTE","meaning":"المطالبة المالية قد تكون تجارية أو عمالية أو عقارية أو تمويلية؛ أصل العلاقة يحدد المسار.","status":"active"},{"rule_id":"RULE-038","rule":"PARTNER DISPUTE ≠ FRAUD","meaning":"الخلاف بين الشركاء لا يصبح جريمة لمجرد عدم السداد أو سوء الإدارة؛ يلزم فصل وقائع الخداع/الاستيلاء المستقلة.","status":"active"},{"rule_id":"RULE-039","rule":"BANKRUPTCY IS A SEPARATE ROUTE","meaning":"الإفلاس وإعادة التنظيم والتصفية مسارات نظامية مستقلة عن دعوى المطالبة العادية.","status":"active"},{"rule_id":"RULE-040","rule":"NEGOTIABLE INSTRUMENT NEEDS REQUIREMENTS CHECK","meaning":"الشيك والسند لأمر والكمبيالة قد تدخل التنفيذ إذا استوفت المتطلبات؛ النزاع على صحتها لا يُختزل في فتح تنفيذ.","status":"active"},{"rule_id":"RULE-041","rule":"ARBITRATION CLAUSE ≠ COURT FIRST","meaning":"وجود اتفاق تحكيم قد يغير بوابة النزاع؛ حكم التحكيم له تنفيذ وبطلان وفق مسارات مختلفة وليس استئنافًا عاديًا.","status":"active"},{"rule_id":"RULE-042","rule":"FRANCHISE REGISTRATION ≠ FRANCHISE DISPUTE","meaning":"قيد الامتياز وتعديله وإلغاؤه خدمة لدى وزارة التجارة، أما النزاع العقدي فيحتاج مسار نزاع مستقل.","status":"active"},{"rule_id":"RULE-043","rule":"IP IS NOT ONE ROUTE","meaning":"العلامات وحقوق المؤلف والبراءات والتصاميم لها خدمات تسجيل وإدارة وإنفاذ مختلفة لدى الهيئة السعودية للملكية الفكرية.","status":"active"},{"rule_id":"RULE-044","rule":"ROLE + STAGE BEFORE CRIME TYPE","meaning":"في الجنائي نحدد صفة المستخدم ومرحلة الإجراء قبل الغوص في نوع الجريمة، لأن الخطوة التالية تتغير جذريًا بذلك.","status":"active"},{"rule_id":"RULE-045","rule":"REPORT ≠ CRIMINAL CASE","meaning":"تقديم البلاغ لا يعني أن قضية جزائية قُيدت في المحكمة؛ قد يمر بالاستدلال والتحقيق أولًا.","status":"active"},{"rule_id":"RULE-046","rule":"NONPAYMENT ≠ FRAUD","meaning":"مجرد عدم السداد أو الإخلال بالعقد لا يساوي احتيالًا؛ نحتاج وقائع خداع أو استيلاء مستقلة قبل بوابة البلاغ الجنائي.","status":"active"},{"rule_id":"RULE-047","rule":"SUMMONS NEEDS AUTHORITY + ROLE","meaning":"عند الاستدعاء نتحقق من الجهة والصفة والمرحلة؛ لا نعطي دفاعًا موضوعيًا.","status":"active"},{"rule_id":"RULE-048","rule":"ARREST/DETENTION RIGHTS FIRST","meaning":"المقبوض/الموقوف يُعرّف بأسباب القبض أو التوقيف وحقه في محام والاتصال بمن يرى إبلاغه، وفق النظام واللائحة.","status":"active"},{"rule_id":"RULE-049","rule":"RELEASE ≠ CASE CLOSED","meaning":"الإفراج لا يعني تلقائيًا حفظ القضية أو انتهائها؛ يجب التحقق من قرار التصرف في التحقيق أو الإحالة.","status":"active"},{"rule_id":"RULE-050","rule":"CRIMINAL COURT STAGE","meaning":"إذا وصلت القضية للمحكمة، نوجّه لإجراءات الجلسة والحكم دون صياغة دفاع أو استراتيجية.","status":"active"},{"rule_id":"RULE-051","rule":"CRIMINAL JUDGMENT HAS OBJECTION ROUTES","meaning":"بعد الحكم نحدد حالة الحكم وطريق الاعتراض/النهائية وفق النظام بدل افتراض مسار واحد.","status":"active"},{"rule_id":"RULE-052","rule":"NO DEFENSE STRATEGY","meaning":"ما يجب قوله للمحقق، الاعتراف أو الإنكار، الدفوع، تقييم الأدلة، وكيفية كسب القضية: حد أحمر لمحامٍ مرخص.","status":"active"},{"rule_id":"RULE-053","rule":"CYBER REPORT PRESERVE EVIDENCE","meaning":"في الجرائم المعلوماتية نوجّه لقناة البلاغ الرسمية ونوصي بحفظ الأدلة دون مواجهة أو دفع مبالغ للمبتز.","status":"active"},{"rule_id":"RULE-054","rule":"PRIVATE RIGHT CAN ARISE DURING INVESTIGATION","meaning":"لمن لحقه ضرر من الجريمة حق الادعاء بالحق الخاص أثناء التحقيق وفق نظام الإجراءات الجزائية، مع مراعاة المسار الإجرائي.","status":"active"},{"rule_id":"RULE-055","rule":"NO DISPUTE → DOCUMENTATION FIRST","meaning":"إذا لا يوجد خصومة، نبحث عن خدمة توثيق/إجراء إلكتروني قبل تحويل المستخدم للقضاء.","status":"active"},{"rule_id":"RULE-056","rule":"POWER OF ATTORNEY IS A DOCUMENTATION ROUTE","meaning":"إصدار الوكالة وفسخها والتحقق منها إجراءات توثيقية مستقلة عن الدعوى القضائية.","status":"active"},{"rule_id":"RULE-057","rule":"PAYMENT ACKNOWLEDGMENT ≠ EXECUTION PROOF OF PAYMENT","meaning":"إقرار السداد بين الأطراف يختلف عن إثبات السداد داخل طلب تنفيذ قائم؛ الثاني ينتقل لمسار التنفيذ.","status":"active"},{"rule_id":"RULE-058","rule":"SOCIAL DOCUMENTATION NEEDS DISPUTE GATE","meaning":"الطلاق والرجعة والحضانة والزواج قد تكون خدمات توثيق، لكن ظهور نزاع يغيّر المسار.","status":"active"},{"rule_id":"RULE-059","rule":"HEIRS DOCUMENTATION ≠ HEIRS DISPUTE","meaning":"إجراءات الورثة والوصية والوقف التوثيقية لا تُستخدم بدل الدعوى عند وجود نزاع.","status":"active"},{"rule_id":"RULE-060","rule":"PROPERTY DOCUMENTATION ≠ PROPERTY DISPUTE","meaning":"التسجيل والرهن ونقل الملكية إجراءات مختلفة عن نزاع الملكية أو التمويل.","status":"active"},{"rule_id":"RULE-061","rule":"DISPUTE EMERGENCE CHANGES ROUTE","meaning":"إذا ظهر اعتراض/نزاع أثناء خدمة توثيق، لا نكمل آليًا كأنها معاملة رضائية؛ نحدد مسار النزاع.","status":"active"},{"rule_id":"RULE-062","rule":"SPECIALIZED AUTHORITY BEFORE GENERAL COURT","meaning":"النزاعات الإدارية والمصرفية والتمويلية والتأمينية والسوقية والضريبية والاتصالات لها بوابات وجهات متخصصة؛ لا تُرسل تلقائيًا للمحكمة العامة.","status":"active"},{"rule_id":"RULE-063","rule":"ADMINISTRATIVE DISPUTE → BOARD OF GRIEVANCES","meaning":"الدعاوى الإدارية وخدماتها القضائية تسير عبر ديوان المظالم ومنصة معين الرقمية وفق الاختصاص.","status":"active"},{"rule_id":"RULE-064","rule":"BANKING/FINANCE NEEDS CORRECT COMMITTEE","meaning":"الشكوى الرقابية لدى البنك المركزي تختلف عن الدعوى أمام لجان المنازعات؛ كما يجب التفريق بين المصرفي والتمويلي.","status":"active"},{"rule_id":"RULE-065","rule":"INSURANCE COMPLAINT ≠ INSURANCE DISPUTE","meaning":"شكوى شركة التأمين لدى هيئة التأمين تختلف عن النزاع أمام لجان الفصل في المنازعات والمخالفات التأمينية.","status":"active"},{"rule_id":"RULE-066","rule":"CMA COMPLAINT BEFORE CRSD","meaning":"في الدعاوى المدنية للأوراق المالية تُودع الشكوى لدى هيئة السوق المالية أولًا؛ ثم بعد 90 يومًا أو إذن الهيئة يمكن التقدم للجنة الفصل.","status":"active"},{"rule_id":"RULE-067","rule":"ZATCA OBJECTION BEFORE GSTC ESCALATION","meaning":"المنازعة الزكوية/الضريبية/الجمركية تبدأ بالاعتراض لدى الهيئة بحسب الحالة، ثم التصعيد للأمانة العامة للجان عند تحقق بوابته.","status":"active"},{"rule_id":"RULE-068","rule":"TELECOM PROVIDER FIRST + DEADLINES","meaning":"شكوى الاتصالات تبدأ لدى مقدم الخدمة خلال 60 يومًا من الفاتورة/الواقعة، ثم التصعيد بعد 5 أيام دون حل أو الإغلاق بلا معالجة، وخلال 180 يومًا.","status":"active"}],"sources":[{"source_id":"SRC-MOJ-EXEC-APPLY","authority":"وزارة العدل","title":"تقديم طلب تنفيذ","url":"https://moj.gov.sa/ar/eservices/pages/1c719954-3463-4754-85e1-1b319b937b86.aspx","last_verified":"2026-09-15","status":"current"},{"source_id":"SRC-MOJ-EXEC-QUERY","authority":"وزارة العدل","title":"استعلام عن طلب تنفيذ","url":"https://moj.gov.sa/ar/eServices/Pages/9bd2e276-3110-4e32-a00e-330de0fec9a4.aspx","last_verified":"2026-09-15","status":"current"},{"source_id":"SRC-MOJ-EXEC-VERIFY","authority":"وزارة العدل","title":"التحقق من طلب التنفيذ","url":"https://www.moj.gov.sa/ar/eServices/Pages/8cc249d5-9f9c-464f-a772-25192e8fdf3b.aspx","last_verified":"2026-09-14","status":"current"},{"source_id":"SRC-HRSD-LABOR-SETTLE","authority":"وزارة الموارد البشرية","title":"التسوية الودية للخلافات العمالية","url":"https://www.hrsd.gov.sa/ministry-services/services/269970","last_verified":"2026-09-15","status":"current"},{"source_id":"SRC-MOJ-EXEC-PAYMENT","authority":"وزارة العدل","title":"إثبات السداد","url":"https://www.moj.gov.sa/ar/eServices/pages/0fabf9ed-05ba-497e-9e4e-1e227103fc00.aspx","last_verified":"2026-09-15","status":"current"},{"source_id":"SRC-MOJ-EXEC-GRACE","authority":"وزارة العدل","title":"طلب إمهال - تأجيل السند التنفيذي","url":"https://www.moj.gov.sa/ar/eServices/Pages/a7eef02b-d9ad-4d3f-9ad0-7b9a67399313.aspx","last_verified":"2026-09-14","status":"current"},{"source_id":"SRC-MOJ-EXEC-REACTIVATE","authority":"وزارة العدل","title":"طلب إعادة تفعيل طلب تنفيذ بعد انتهاء مدة الإمهال","url":"https://www.moj.gov.sa/ar/eServices/Pages/42bc9d16-70e4-43ad-bb8d-0a8e156ffb72.aspx","last_verified":"2026-09-14","status":"current"},{"source_id":"SRC-MOJ-EXEC-TRANSFER","authority":"وزارة العدل","title":"طلب تحويل مبلغ محجوز","url":"https://www.moj.gov.sa/ar/eServices/Pages/9bc63703-4291-4cc6-9615-ac15a3cfce36.aspx","last_verifi
