<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>وش بعد؟ — لوحة الإدارة</title><style>body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f7f9;color:#111827}.wrap{max-width:1100px;margin:auto;padding:24px}h1{margin:0 0 8px}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:22px 0}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px}.n{font-size:30px;font-weight:800;margin-top:6px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.row{grid-template-columns:1fr}}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:10px;border-bottom:1px solid #eee;font-size:14px}input,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #d0d5dd}button{cursor:pointer;background:#111827;color:white}.auth{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.auth input{min-width:260px;flex:1}#error{color:#b42318;margin-top:10px}</style></head><body><div class="wrap"><h1>لوحة إدارة «وش بعد؟»</h1><div class="muted">نسخة تطوير v1.3</div><div class="auth"><input id="api" placeholder="رابط Business API"><input id="key" type="password" placeholder="ADMIN_API_KEY"><button id="load">تحميل</button></div><div id="error"></div><section class="grid"><div class="card"><div class="muted">زوار اليوم</div><div id="today" class="n">—</div></div><div class="card"><div class="muted">آخر 7 أيام</div><div id="week" class="n">—</div></div><div class="card"><div class="muted">آخر 30 يومًا</div><div id="month" class="n">—</div></div><div class="card"><div class="muted">متوسط التقييم</div><div id="rating" class="n">—</div></div><div class="card"><div class="muted">تذاكر مفتوحة</div><div id="tickets" class="n">—</div></div></section><div class="row"><div class="card"><h2>أكثر النتائج مشاهدة</h2><table><tbody id="results"></tbody></table></div><div class="card"><h2>مصادر الزيارات</h2><table><tbody id="campaigns"></tbody></table></div></div></div><script>const $=id=>document.getElementById(id);const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));async function load(){const api=$("api").value.trim().replace(/\/$/,""),key=$("key").value;$("error").textContent="";if(!api||!key){$("error").textContent="أدخل رابط الـAPI ومفتاح الإدارة";return}try{const r=await fetch(api+"/api/admin/summary",{headers:{authorization:"Bearer "+key}});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();$("today").textContent=d.visitors.today;$("week").textContent=d.visitors.days7;$("month").textContent=d.visitors.days30;$("rating").textContent=d.feedback.average_rating??"—";$("tickets").textContent=d.support.open;$("results").innerHTML=(d.top_results||[]).map(x=>"<tr><td>"+safe(x.result_id)+"</td><td>"+safe(x.views)+"</td></tr>").join("");$("campaigns").innerHTML=(d.campaigns||[]).map(x=>"<tr><td>"+safe(x.source)+"</td><td>"+safe(x.sessions)+"</td></tr>").join("")}catch(e){$("error").textContent="تعذر تحميل البيانات: "+e.message}}$("load").addEventListener("click",load);</script></body></html>
