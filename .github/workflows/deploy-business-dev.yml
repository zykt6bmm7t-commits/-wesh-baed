name: Deploy v1.3 Business Dev Worker

on:
  workflow_dispatch:
  push:
    branches:
      - dev-v1.3-business
    paths:
      - "business/worker/**"
      - "business/wrangler.jsonc"
      - "business/package.json"
      - ".github/workflows/deploy-business-dev.yml"

permissions:
  contents: read

concurrency:
  group: wesh-baed-business-api-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy development Worker only
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Health check
        run: |
          node - <<'NODE'
          const url = "https://wesh-baed-business-api-dev.97tn6h2yzj.workers.dev/api/health";
          const r = await fetch(url);
          const text = await r.text();
          console.log("status:", r.status);
          console.log("body:", text);
          if (!r.ok) process.exit(1);
          const data = JSON.parse(text);
          if (data.ok !== true || data.service !== "wesh-baed-business-api") process.exit(1);
          NODE
