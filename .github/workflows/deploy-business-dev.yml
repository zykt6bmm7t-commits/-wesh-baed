name: Deploy v1.3 Business Dev Worker
# admin secret refresh trigger

on:
  workflow_dispatch:
  push:
    branches:
      - dev-v1.3-business
    paths:
      - "business/worker/**"
      - "business/wrangler.jsonc"
      - "business/package.json"
      - ".github/workflows/deploy-business-dev.yml"

permissions:
  contents: read

concurrency:
  group: wesh-baed-business-api-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy development Worker only
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure optional admin secret
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$ADMIN_API_KEY" ]; then
            printf '%s' "$ADMIN_API_KEY" | npx wrangler secret put ADMIN_API_KEY --config wrangler.jsonc
          else
            echo "ADMIN_API_KEY is not configured; admin endpoints stay locked."
          fi

      - name: Configure optional Turnstile secret
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TURNSTILE_SECRET_KEY" ]; then
            printf '%s' "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY --config wrangler.jsonc
            echo "TURNSTILE_SECRET_KEY configured."
          else
            echo "TURNSTILE_SECRET_KEY not configured yet; development bypass remains available."
          fi

      - name: Health check
        run: |
          node - <<'NODE'
          const url = "https://wesh-baed-business-api-dev.97tn6h2yzj.workers.dev/api/health";
          const r = await fetch(url);
          const text = await r.text();
          console.log("status:", r.status);
          console.log("body:", text);
          if (!r.ok) process.exit(1);
          const data = JSON.parse(text);
          if (data.ok !== true || data.service !== "wesh-baed-business-api") process.exit(1);
          NODE


      - name: Business API end-to-end gate
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          node - <<'NODE'
          const base = "https://wesh-baed-business-api-dev.97tn6h2yzj.workers.dev";
          const adminKey = process.env.ADMIN_API_KEY || "";
          if (!adminKey) throw new Error("ADMIN_API_KEY missing");

          const stamp = "e2e-" + process.env.GITHUB_RUN_ID + "-" + Date.now();
          const session = "dev-" + stamp;
          const headers = {"content-type":"application/json"};

          async function json(path, init={}) {
            const r = await fetch(base + path, init);
            const text = await r.text();
            let data = null;
            try { data = JSON.parse(text); } catch {}
            return {r, data, text};
          }

          // Admin page
          const adminPage = await fetch(base + "/admin");
          const adminHtml = await adminPage.text();
          if (!adminPage.ok || !adminHtml.includes("لوحة إدارة")) throw new Error("admin_page_failed");

          // Unauthorized admin must be rejected
          const unauth = await fetch(base + "/api/admin/summary");
          if (unauth.status !== 401) throw new Error("admin_auth_gate_failed");

          // Synthetic visitor journey
          for (const payload of [
            {event_name:"session_start",session_id:session,path:"/"},
            {event_name:"page_view",session_id:session,path:"/"},
            {event_name:"question_view",session_id:session,path:"/",question_id:"Q001"},
            {event_name:"question_view",session_id:session,path:"/",question_id:"Q110"},
            {event_name:"result_view",session_id:session,path:"/",result_id:"E2E_RESULT"}
          ]) {
            const x = await json("/api/events",{method:"POST",headers,body:JSON.stringify(payload)});
            if (x.r.status !== 201 || x.data?.ok !== true) throw new Error("event_failed:"+x.r.status+":"+x.text);
          }

          // Feedback
          const fb = await json("/api/feedback",{method:"POST",headers,body:JSON.stringify({
            session_id:session,result_id:"E2E_RESULT",rating:5,helpful:true,comment:"E2E DEV TEST "+stamp
          })});
          if (fb.r.status !== 201 || fb.data?.ok !== true) throw new Error("feedback_failed:"+fb.r.status+":"+fb.text);

          // Support ticket
          const message = "E2E DEV TEST ticket " + stamp;
          const sup = await json("/api/support",{method:"POST",headers,body:JSON.stringify({
            session_id:session,category:"technical",message,contact:"e2e-dev"
          })});
          if (sup.r.status !== 201 || !sup.data?.ticket_id) throw new Error("support_failed:"+sup.r.status+":"+sup.text);

          const auth = {authorization:"Bearer "+adminKey};

          // Summary must reflect synthetic journey
          const sum = await json("/api/admin/summary",{headers:auth});
          if (!sum.r.ok) throw new Error("summary_failed:"+sum.r.status+":"+sum.text);
          const topHit = (sum.data?.top_results||[]).some(x=>x.result_id==="E2E_RESULT");
          const qHit = (sum.data?.top_questions||[]).some(x=>x.question_id==="Q001");
          if (!topHit || !qHit) throw new Error("analytics_not_reflected");
          if (Number(sum.data?.feedback?.count||0) < 1) throw new Error("feedback_not_reflected");
          if (Number(sum.data?.support?.open||0) < 1) throw new Error("support_not_reflected");

          // Ticket must be visible and mutable
          const ts = await json("/api/admin/tickets?limit=100",{headers:auth});
          if (!ts.r.ok) throw new Error("tickets_failed:"+ts.r.status+":"+ts.text);
          const ticket = (ts.data?.tickets||[]).find(t=>t.id===sup.data.ticket_id && t.message===message);
          if (!ticket) throw new Error("ticket_not_found");

          const patch = await json("/api/admin/tickets/"+encodeURIComponent(sup.data.ticket_id),{
            method:"PATCH",headers:{...auth,"content-type":"application/json"},body:JSON.stringify({status:"closed"})
          });
          if (!patch.r.ok || patch.data?.ok !== true) throw new Error("ticket_patch_failed:"+patch.r.status+":"+patch.text);

          console.log("BUSINESS_E2E_PASS", JSON.stringify({
            health:true,admin_page:true,admin_auth:true,events:5,feedback:true,support:true,
            summary:true,ticket_lifecycle:true,session
          }));
          NODE
