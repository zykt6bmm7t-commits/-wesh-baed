name: Build lawyer final review packet

on:
  workflow_dispatch:
  push:
    branches: [interactive-preview]
    paths:
      - scripts/source_link_audit.js
      - scripts/lawyer_handoff_packet.js
      - scripts/lawyer_handoff_qa.js
      - scripts/non_legal_qa.js
      - scripts/non_legal_report.js
      - scripts/non_legal_hardening.js
      - scripts/ui_hardening.js
      - scripts/search_hardening.js
      - scripts/security_hardening.js
      - scripts/build_legal_report_viewer.js
      - scripts/report_viewer_qa.js
      - .github/workflows/lawyer-final-review.yml

permissions:
  contents: write

concurrency:
  group: lawyer-final-review-interactive-preview
  cancel-in-progress: false

jobs:
  build-packet:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: interactive-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply non-legal hardening
        run: |
          node scripts/non_legal_hardening.js
          node scripts/ui_hardening.js
          node scripts/search_hardening.js
          node scripts/security_hardening.js
      - name: Audit all official source links
        run: node scripts/source_link_audit.js
      - name: Generate lawyer packet
        run: node scripts/lawyer_handoff_packet.js
      - name: Validate packet coverage
        run: node scripts/lawyer_handoff_qa.js
      - name: Validate non-legal hardening
        run: node scripts/non_legal_qa.js
      - name: Generate non-legal report
        run: node scripts/non_legal_report.js
      - name: Build full legal report viewer
        run: node scripts/build_legal_report_viewer.js
      - name: Validate full legal report viewer
        run: node scripts/report_viewer_qa.js
      - name: Validate legal master integrity
        run: node scripts/legal_approval_qa.js
      - name: Commit generated packet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html wesh_baed_sale_final_candidate.html docs/LAWYER_FINAL_REVIEW_PACKET docs/non-legal-hardening reports/legal-approval-master
          if git diff --cached --quiet; then
            echo "Packet already current"
          else
            git commit -m "Generate licensed lawyer final review packet"
            git push origin HEAD:interactive-preview
          fi
