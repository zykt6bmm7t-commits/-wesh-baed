name: Build lawyer final review packet

on:
  workflow_dispatch:
  push:
    branches: [interactive-preview]
    paths:
      - scripts/source_link_audit.js
      - scripts/lawyer_handoff_packet.js
      - scripts/lawyer_handoff_qa.js
      - .github/workflows/lawyer-final-review.yml

permissions:
  contents: write

concurrency:
  group: lawyer-final-review-interactive-preview
  cancel-in-progress: false

jobs:
  build-packet:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: interactive-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit all official source links
        run: node scripts/source_link_audit.js
      - name: Generate lawyer packet
        run: node scripts/lawyer_handoff_packet.js
      - name: Validate packet coverage
        run: node scripts/lawyer_handoff_qa.js
      - name: Validate legal master integrity
        run: node scripts/legal_approval_qa.js
      - name: Commit generated packet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LAWYER_FINAL_REVIEW_PACKET
          if git diff --cached --quiet; then
            echo "Packet already current"
          else
            git commit -m "Generate licensed lawyer final review packet"
            git push origin HEAD:interactive-preview
          fi
