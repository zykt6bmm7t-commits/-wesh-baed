name: Result audit upgrade
on:
  push:
    branches: [interactive-preview]
    paths:
      - scripts/upgrade_results.js
      - scripts/result_audit.js
      - scripts/review_readiness.js
      - .github/workflows/result-audit-upgrade.yml
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: interactive-preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade all results
        run: node scripts/upgrade_results.js
      - name: Build multidisciplinary review artifacts
        run: node scripts/review_readiness.js
      - name: Run structural audit
        run: node scripts/result_audit.js index.html > result-audit-report.json
      - name: Enforce release invariants
        run: node -e "const r=require('./result-audit-report.json'),q=r.qa;for(const k of ['broken_next_id','unreachable_questions','unreachable_results','dead_ends','missing_source_id','immediate_two_node_loops'])if(q[k]!==0)throw Error(k+'='+q[k])"
      - name: Validate JavaScript
        run: node -e "const fs=require('fs'),t=fs.readFileSync('index.html','utf8');for(const m of t.matchAll(/<script>([\\s\\S]*?)<\\/script>/g))new Function(m[1])"
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html wesh_baed_sale_final_candidate.html wesh_baed_v186_PREMIUM_UI.html service-worker.js result-audit-report.json docs
          git diff --cached --quiet || git commit -m "Apply multidisciplinary readiness review"
          git push origin HEAD:interactive-preview
