اء بمجلس الوزراء — نظام مزاولة المهن الصحية","ui_requirements":"السجل الطبي + التقارير ونتائج الفحوص + الفواتير إن وجدت + توثيق الضرر والتسلسل الزمني.","ui_what_happens_next":"تقوم المسؤولية عن الخطأ المهني الصحي إذا ترتب عليه ضرر وفق نظام مزاولة المهن الصحية؛ والنتيجة العلاجية السيئة وحدها لا تثبت الخطأ.","what_happens_next":"تقوم المسؤولية عن الخطأ المهني الصحي إذا ترتب عليه ضرر وفق نظام مزاولة المهن الصحية؛ والنتيجة العلاجية السيئة وحدها لا تثبت الخطأ."},"R-SP-MOTOR-REPORT":{"action_required":"نعم","current_situation":"الحادث المروري ما زال في مرحلة إثبات الواقعة وتحديد المسؤولية.","last_verified":"2026-09-20","lawyer_boundary":"وجود إصابات أو وفاة أو حالة تستوجب المرور/الطوارئ يغيّر الإجراء؛ لا تعاملها كحادث أضرار مركبة بسيط.","next_step":"ابدأ بمباشرة الحادث عبر الجهة المختصة بحسب حالة الحادث، واحصل على تقرير الحادث وتحديد المسؤولية. توجد خدمات رقمية لبعض حوادث المركبات، لكن وجود إصابات أو وفاة أو حالة تستوجب المرور/الطوارئ يغيّر المسار.","requirements":"بيانات الأطراف والمركبات والتأمين وموقع ووقت الحادث تُجمع لتسجيل الواقعة وتحديدها، وليست كلها مستندات. قد تطلب الجهة المباشرة مستندات أو إثباتات إضافية بحسب حالة الحادث؛ اتبع ما يظهر في القناة المختصة.","result_id":"R-SP-MOTOR-REPORT","result_type":"مباشرة حادث","source_id":"SRC-IA-MOTOR-DIGITAL","status":"production","ui_action_required":"أثبت الحادث واحصل على تقرير وتحديد للمسؤولية","ui_caution":"وجود إصابات أو وفاة أو حالة تستوجب المرور/الطوارئ يغيّر الإجراء؛ لا تعاملها كحادث أضرار مركبة بسيط.","ui_current_situation":"الحادث المروري ما زال في مرحلة إثبات الواقعة وتحديد المسؤولية.","ui_next_step":"ابدأ بإثبات الحادث لدى الجهة التي تباشر حالتك، واحصل على تقرير الحادث وتحديد المسؤولية. إذا وجدت إصابات أو وفاة أو حالة طارئة فاتبع مسار المرور/الطوارئ بدل مسار الأضرار البسيطة.","ui_official_source":"هيئة التأمين — رقمنة خدمات حوادث وتأمين المركبات","ui_requirements":"بيانات الأطراف والمركبات والتأمين وموقع ووقت الحادث تُجمع لتسجيل الواقعة وتحديدها، وليست كلها مستندات. قد تطلب الجهة المباشرة مستندات أو إثباتات إضاف function guideInfo(){progress.hidden=true;set('<div class="eyebrow">معلومات الدليل</div><h2 class="miniTitle">كل ما تحتاجه قبل الاستخدام</h2><div class="grid"><button class="tile" id="gHow">طريقة الاستخدام<small>كيف تتنقل داخل الدليل وتقرأ النتيجة.</small></button><button class="tile" id="gInfo">عن الدليل<small>حدود الاستخدام والمصادر والتحديثات.</small></button><button class="tile" id="gHelp">المساعدة وحقوق الاستخدام<small>الخصوصية، حقوق النسخة، وماذا تفعل إذا واجهتك مشكلة.</small></button></div><div class="nav"><button class="btn primary" id="backdash">رجوع</button></div>');document.getElementById('gHow').onclick=how;document.getElementById('gInfo').onclick=info;document.getElementById('gHelp').onclick=help;document.getElementById('backdash').onclick=dashboard}
function norm(s){return String(s||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ًٌٍَُِّْـ]/g,'').replace(/[^\u0600-\u06FFa-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
const QUICK=[["Q010","مبلغ حق مالي دين قرض سلف سلفه شيك سند فلوس مطالبه مديونيه استرداد مبلغ سلفتي رجع رجعها فلوسي"],["Q020","ناجز اشعار رساله وصلني تبليغ تبليغات موعد جلسه محكمه قضيه ناجز"],["Q030","حكم صدر حكم محكوم اعتراض اعترض استئناف استأنف استانف نقض قطعي حكم نهائي صك حكم استناف"],["Q040","تنفيذ طلب تنفيذ منفذ ضده طالب تنفيذ سداد سدد سددت حجز ايقاف خدمات منع سفر تنفيذ قضائي محكمه التنفيذ"],["Q050","عمل عمالي راتب راتبي رواتب فصل فصلوني مفصول وظيفه وظيفتي دوام موظف عامل عقد عمل مستحقات عماليه شركتي صاحب العمل تسويه وديه اجازه مكافاه نهايه خدمه مستحقاتي فصلني"],["Q060","احوال شخصيه طلاق خلع حضانه حضانه عيال اولاد نفقه نفقة زياره زواج ورث ورثه تركه مواريث زوج زوجتي زوجه النفقة يدفع"],["Q070","عقار عقاري ايجار الايجار مستاجر المستاجر مؤجر عقد ايجار ملكيه ارض صك عقاري عقار اخلاء اجار الصك"],["Q080","شركه تجاره تجاري نشاط تجاري شريك شريكي مؤسسه تحكيم افلاس علامه علامتي تجاريه براءه اختراع ملكيه فكريه سجل تجاري السجل"],["Q090","بلاغ جنائي قضيه شرطه الشرطه تحقيق توقيف موقوف جريمه نصب احتيال استدعاء استدعوني استدعتني نيابه سجن قبض متهم مجني عليه موقوف النيابه النيابة طالبتني"],["Q100","توثيق وكاله وكاله اقرار ناجز بدون نزاع توكيل موثق كاتب عدل كتابه عدل"],["Q110","بنك بنكي تمويل تامين التأمين تعويض ضريبه زكاه اتصالات شركه الاتصالات حكوميه جهه حكوميه جامعه الجامعه مياه المياه طيران بلديه مرور شكوي شكوى مزود خدمه البنك بالبنك البلديه البلدية خصموا المعامله المعاملة المويه"]];
const QUICK_PHRASES=[["Q080",["سجل تجاري","السجل التجاري","نشاط تجاري","علامه تجاريه","ملكيه فكريه"]],["Q090",["موقوف على قضيه","موقوف في قضيه","توقيف على قضيه","الشرطه استدعتني","النيابه طالبتني"]],["Q040",["طلب تنفيذ","ايقاف خدمات","منفذ ضده","طالب تنفيذ","محكمه التنفيذ","حكم تنفيذ"]],["Q050",["صاحب العمل","نهايه خدمه","تسويه وديه","عقد عمل"]],["Q070",["عقد الايجار","عقد ايجار","مستاجر عليه تنفيذ","صك عقاري"]],["Q110",["جهه حكوميه","شركه التامين","شركه الاتصالات"]],["Q030",["ناجز حكم"]]];
function quickScores(v){const q=norm(v),words=q.split(' ').filter(x=>x.length>1);return QUICK.map(([id,terms])=>{const set=new Set(norm(terms).split(' '));let score=words.reduce((n,w)=>n+(set.has(w)?3:0),0);for(const [pid,phrases] of QUICK_PHRASES)if(pid===id)for(const phrase of phrases)if(q.includes(norm(phrase)))score+=12;return{id,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score)}
function renderQuickSearch(v,box){const q=norm(v);box.innerHTML='';if(q.length<2)return;const all=quickScores(v),hits=all.slice(0,3);if(!hits.length){box.innerHTML='<div class="searchHint">ما لقيت تطابق واضح. اختر «ابدأ حالتك» ويمشي معك الدليل خطوة بخطوة.</div>';return}const ambiguous=hits.length>1&&(hits[0].score-hits[1].score<6);const note=ambiguous?'<div class="searchHint"><b>لقيت أكثر من احتمال.</b> اختر الأقرب لوضعك، وبعدها تكمل الأسئلة للتأكد.</div>':'<div class="searchHint">هذا أقرب قسم لعبارتك. أكمل الأسئلة للتأكد من حالتك.</div>';const shown=ambiguous?hits:hits.slice(0,1);box.innerHTML=note+shown.map(x=>'<button class="tile" data-search-next="'+esc(x.id)+'">'+esc(DB.nodes[x.id].text)+'<small>'+(ambiguous?'احتمال مناسب لعبارتك — اضغط إذا كان الأقرب.':'انتقل لهذا القسم وأكمل الأسئلة للتأكد.')+'</small></button>').join('');box.querySelectorAll('[data-search-next]').forEach(b=>b.onclick=()=>{current=b.dataset.searchNext;historyStack=[DB.start];saveState();render()})}
function how(){progress.hidden=true;set('<div class="eyebrow">طريقة الاستخدام</div><h2 class="miniTitle">ثلاث خطوات فقط</h2><div class="infoRow"><b>١ — ابدأ حالتك</b><span>اختر الإجابة الأقرب لوضعك، ولا تحتاج معرفة المصطلح القانوني مسبقًا.</span></div><div class="infoRow"><b>٢ — أكمل الأسئلة</b><span>يظهر سؤال واحد فقط في كل شاشة حسب إجابتك السابقة.</span></div><div class="infoRow"><b>٣ — خذ خطوتك التالية</b><span>تظهر النتيجة والإجراء والمستندات والمصدر الرسمي عندما يكون متاحًا.</span></div><div class="nav"><button class="btn primary" id="backdash">لوحة التحكم</button></div>');document.getElementById('backdash').onclick=dashboard}
function info(){progress.hidden=true;set('<div class="eyebrow">عن الدليل</div><h2 class="miniTitle">معلومات مهمة</h2><div class="infoRow"><b>الغرض</b><span>مساعدتك على تحديد المسار الإجرائي الأقرب والخطوة التالية.</span></div><div class="infoRow"><b>المصادر</b><span>النتائج مرتبطة بمصادر رسمية محفوظة داخل بيانات الدليل.</span></div><div class="infoRow"><b>حدود الاستخدام</b><span>الدليل إرشادي ولا يحل محل الاستشارة المتخصصة في الحالات التي تحتاج تقييمًا قانونيًا.</span></div><div class="infoRow"><b>الخصوصية</b><span>المحتوى الأساسي يعمل داخل الملف نفسه ولا يحتاج إرسال إجاباتك إلى خادم.</span></div><div class="infoRow"><b>الإصدار</b><span>الإصدار 1.0 — آخر مراجعة للمصادر: سبتمبر 2026.</span></div><div class="infoRow"><b>حقوق الاستخدام</b><span>النسخة مخصصة للاستخدام الشخصي للمشتري. لا تشمل إعادة البيع أو إعادة النشر أو التوزيع التجاري دون إذن صاحب المنتج.</span></div><div class="infoRow"><b>التحديثات</b><span>الإجراءات والروابط الرسمية قد تتغير؛ اعتمد المصدر الرسمي الظاهر في النتيجة عند التنفيذ.</span></div><div class="legalbox"><b>تنبيه الاستخدام</b><br>هذا المنتج دليل إرشادي لتسهيل فهم المسارات والإجراءات، وليس تمثيلًا قانونيًا أو ضمانًا لنتيجة أي إجراء. تحقّق من المصدر الرسمي عند التنفيذ، واستعن بمختص عندما تتطلب الحالة تقييمًا قانونيًا.</div><div class="nav"><button class="btn primary" id="backdash">لوحة التحكم</button></div>');document.getElementById('backdash').onclick=dashboard}
function help(){progress.hidden=true;set('<div class="eyebrow">المساعدة وحقوق الاستخدام</div><h2 class="miniTitle">قبل الاستخدام</h2><div class="infoRow"><b>خصوصية إجاباتك</b><span>اختياراتك ومسارك الأساسي يُحفظان محليًا في متصفحك لاستكمال المسار، ولا يرسل هذا الملف إجاباتك إلى خادم خاص بالمنتج. عند فتح مصدر رسمي فإنك تنتقل إلى موقع خارجي وتطبق عليه سياسة ذلك الموقع.</span></div><div class="infoRow"><b>حقوق النسخة</b><span>هذه النسخة مرخصة للاستخدام الشخصي للمشتري. لا يجوز إعادة بيع الملف أو نسخه للنشر العام أو توزيعه تجاريًا دون إذن صاحب المنتج.</span></div><div class="infoRow"><b>إذا واجهتك مشكلة</b><span>أعد فتح الملف في متصفح حديث، ثم جرّب بدء مسار جديد. إذا استمرت المشكلة فتواصل عبر قناة الدعم المعلنة في المتجر الذي اشتريت منه وأرسل وصف المشكلة وصورة للشاشة دون بيانات شخصية حساسة.</span></div><div class="infoRow"><b>المعلومات والإجراءات</b><span>قد تتغير خدمات الجهات ومتطلباتها بعد تاريخ المراجعة. المصدر الرسمي المرتبط بكل نتيجة هو المرجع عند التنفيذ.</span></div><div class="infoRow"><b>الشراء والاسترجاع</b><span>شروط الشراء والتسليم والاسترجاع واسترداد المبالغ تحكمها السياسة المعروضة في المتجر قبل إتمام الطلب، وليست هذه الصفحة بديلًا عنها.</span></div><div class="legalbox"><b>حدود المنتج</b><br>«وش بعد؟» أداة إرشادية لتنظيم الوصول إلى المسار الأقرب، ولا تنشئ علاقة محاماة أو تمثيل قانوني، ولا تضمن قبول طلب أو نتيجة إجراء.</div><div class="nav"><button class="btn primary" id="backdash">لوحة التحكم</button></div>');document.getElementById('backdash').onclick=dashboard}
function start(){current=DB.start;historyStack=[];saveState();render()} function saveState(){try{localStorage.setItem('wb_current',current||'');localStorage.setItem('wb_history',JSON.stringify(historyStack))}catch(e){}} function resume(){try{const s=localStorage.getItem('wb_current'),h=JSON.parse(localStorage.getItem('wb_history')||'[]');if(s&&(DB.nodes[s]||DB.results[s])){current=s;historyStack=Array.isArray(h)?h:[];render()}else start()}catch(e){start()}}
function go(id){if(current)historyStack.push(current);current=id;saveState();render()}
function back(){if(historyStack.length){current=historyStack.pop();saveState();render()}else dashboard()}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}
function clearSaved(){try{localStorage.removeItem('wb_current');localStorage.removeItem('wb_history')}catch(e){}}
function copyResult(r){const s=['وش بعد؟','وضعك الآن: '+(r.ui_current_situation||r.current_situation||''),'الخطوة التالية: '+(r.ui_next_step||r.next_step||''),'المتطلبات: '+(r.ui_requirements||r.requirements||''),'وش يصير بعد كذا؟ '+(r.ui_what_happens_next||r.what_happens_next||''),'ملاحظة مهمة: '+(r.ui_caution||r.lawyer_boundary||'')].join('\n');const fallback=()=>{try{const t=document.createElement('textarea');t.value=s;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();t.setSelectionRange(0,t.value.length);const ok=document.execCommand('copy');t.remove();toast(ok?'تم نسخ ملخص النتيجة':'تعذر النسخ على هذا المتصفح')}catch(e){toast('تعذر النسخ على هذا المتصفح')}};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(()=>toast('تم نسخ ملخص النتيجة')).catch(fallback)}else fallback()}
function render(){progress.hidden=false;bar.style.width=Math.min(94,12+historyStack.length*9)+'%';const n=DB.nodes[current],r=DB.results[current];if(n){const choices=DB.options[current]||[];set('<div class="eyebrow">اختر الإجابة الأقرب لحالتك</div><h1 class="qtitle">'+esc(n.text)+'</h1><div class="options">'+choices.map(o=>'<button class="opt" data-next="'+esc(o.next_id)+'">'+esc(o.label)+'</button>').join('')+'</div><div class="nav"><button class="btn" id="prev">السابق</button><button class="btn" id="dash">لوحة التحكم</button></div>');screen.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{b.classList.add('selected');setTimeout(()=>go(b.dataset.next),120)});document.getElementById('prev').onclick=back;document.getElementById('dash').onclick=dashboard;return}if(r){bar.style.width='100%';const s=DB.sources[r.source_id]||null;const blocks=[['وضعك الآن',r.ui_current_situation||r.current_situation],['وش تسوي الآن؟',r.ui_next_step||r.next_step],['وين تروح؟',s?(s.authority+(s.title?' — '+s.title:'')):(r.ui_official_source||'')],['وش تحتاج؟',r.ui_requirements||r.requirements],['وش يصير بعد كذا؟',r.ui_what_happens_next||r.what_happens_next],['انتبه',r.ui_caution||r.lawyer_boundary]].filter(x=>x[1]);const reviewed=r.last_verified?'<div class="fine">آخر مراجعة: '+esc(r.last_verified)+'</div>':'';set('<div class="resultHead"><div class="eyebrow">'+esc(r.result_type||'النتيجة')+'</div><h1>هذه هي الخطوة الأقرب لحالتك</h1></div>'+blocks.map(x=>'<div class="section"><b>'+esc(x[0])+'</b><p>'+esc(x[1])+'</p></div>').join('')+(s&&s.url?'<a class="source" href="'+esc(s.url)+'" target="_blank" rel="noopener">فتح المصدر الرسمي — '+esc(s.authority||s.title)+'</a>':'')+reviewed+'<div class="resultTools"><button class="btn" id="copy">نسخ ملخص النتيجة</button><button class="btn" id="dash">لوحة التحكم</button></div><div class="nav"><button class="btn" id="prev">السابق</button><button class="btn primary" id="again">ابدأ من جديد</button></div>');document.getElementById('prev').onclick=back;document.getElementById('again').onclick=()=>{clearSaved();start()};document.getElementById('dash').onclick=dashboard;document.getElementById('copy').onclick=()=>copyResult(r);return}set('<h1 class="qtitle">تعذر فتح هذا المسار</h1><button class="btn primary" id="dash">لوحة التحكم</button>');document.getElementById('dash').onclick=dashboard}
cover();
</script></body></html>
