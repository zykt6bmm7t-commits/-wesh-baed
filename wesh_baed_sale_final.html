function set(html){screen.innerHTML='<div class="panel">'+html+'</div>';window.scrollTo({top:0,behavior:'instant'})}
function cover(){current=null;historyStack=[];progress.hidden=true;set('<div class="cover"><div class="mark">؟</div><div class="eyebrow">دليلك الإجرائي التفاعلي</div><h1 class="hero">وش بعد؟</h1><div class="goldline" style="margin-inline:auto"></div><p class="lead">اعرف وضعك، خذ خطوتك التالية، وارجع للمصدر الرسمي — بتجربة هادئة وواضحة.</p><div class="trust"><span>ملف واحد</span><span>خصوصية محلية</span><span>مصادر رسمية</span><span>تجربة تفاعلية</span></div><button class="btn primary" id="enter">دخول الدليل</button></div>');document.getElementById('enter').onclick=dashboard}
function dashboard(){current=null;historyStack=[];progress.hidden=true;const saved=localStorage.getItem('wb_current');set('<div class="dashboard"><div class="eyebrow">لوحة التحكم</div><h1 class="hero">وين تبي تبدأ؟</h1><p class="lead">اختر القسم، وتقدر ترجع لهذه الشاشة في أي وقت.</p><div class="grid"><button class="tile" id="start">ابدأ حالتك<small>مسار تفاعلي يظهر لك سؤالًا واحدًا في كل خطوة.</small></button><button class="tile" id="how">طريقة الاستخدام<small>كيف تتنقل داخل الدليل وتقرأ النتيجة.</small></button><button class="tile" id="info">عن الدليل<small>حدود الاستخدام والمصادر والتحديثات.</small></button></div>'+((saved&&DB.nodes[saved])?'<div class="resume"><b>عندك مسار سابق غير مكتمل</b><span>تقدر تكمل من آخر سؤال وصلت له.</span><button class="btn" id="resume">متابعة المسار السابق</button></div>':'')+'</div>');document.getElementById('start').onclick=()=>start();document.getElementById('how').onclick=how;document.getElementById('info').onclick=info;const rs=document.getElementById('resume');if(rs)rs.onclick=resume}
function how(){progress.hidden=true;set('<div class="eyebrow">طريقة الاستخدام</div><h2 class="miniTitle">ثلاث خطوات فقط</h2><div class="infoRow"><b>١ — ابدأ حالتك</b><span>اختر الإجابة الأقرب لوضعك، ولا تحتاج معرفة المصطلح القانوني مسبقًا.</span></div><div class="infoRow"><b>٢ — أكمل الأسئلة</b><span>يظهر سؤال واحد فقط في كل شاشة حسب إجابتك السابقة.</span></div><div class="infoRow"><b>٣ — خذ خطوتك التالية</b><span>تظهر النتيجة والإجراء والمستندات والمصدر الرسمي عندما يكون متاحًا.</span></div><div class="nav"><button class="btn primary" id="backdash">لوحة التحكم</button></div>');document.getElementById('backdash').onclick=dashboard}
function info(){progress.hidden=true;set('<div class="eyebrow">عن الدليل</div><h2 class="miniTitle">معلومات مهمة</h2><div class="infoRow"><b>الغرض</b><span>مساعدتك على تحديد المسار الإجرائي الأقرب والخطوة التالية.</span></div><div class="infoRow"><b>المصادر</b><span>النتائج مرتبطة بمصادر رسمية محفوظة داخل بيانات الدليل.</span></div><div class="infoRow"><b>حدود الاستخدام</b><span>الدليل إرشادي ولا يحل محل الاستشارة المتخصصة في الحالات التي تحتاج تقييمًا قانونيًا.</span></div><div class="infoRow"><b>الخصوصية</b><span>المحتوى الأساسي يعمل داخل الملف نفسه ولا يحتاج إرسال إجاباتك إلى خادم.</span></div><div class="legalbox"><b>تنبيه الاستخدام</b><br>هذا المنتج دليل إرشادي لتسهيل فهم المسارات والإجراءات، وليس تمثيلًا قانونيًا أو ضمانًا لنتيجة أي إجراء. تحقّق من المصدر الرسمي عند التنفيذ، واستعن بمختص عندما تتطلب الحالة تقييمًا قانونيًا.</div><div class="nav"><button class="btn primary" id="backdash">لوحة التحكم</button></div>');document.getElementById('backdash').onclick=dashboard}
function start(){current=DB.start;historyStack=[];saveState();render()} function saveState(){try{localStorage.setItem('wb_current',current||'');localStorage.setItem('wb_history',JSON.stringify(historyStack))}catch(e){}} function resume(){try{const s=localStorage.getItem('wb_current'),h=JSON.parse(localStorage.getItem('wb_history')||'[]');if(s&&(DB.nodes[s]||DB.results[s])){current=s;historyStack=Array.isArray(h)?h:[];render()}else start()}catch(e){start()}}
function go(id){if(current)historyStack.push(current);current=id;saveState();render()}
function back(){if(historyStack.length){current=historyStack.pop();saveState();render()}else dashboard()}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}
function clearSaved(){try{localStorage.removeItem('wb_current');localStorage.removeItem('wb_history')}catch(e){}}
function copyResult(r){const s=['وش بعد؟','وضعك الآن: '+(r.current_situation||''),'الخطوة التالية: '+(r.next_step||''),'المتطلبات: '+(r.requirements||'')].join('\n');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(()=>toast('تم نسخ ملخص النتيجة')).catch(()=>toast('تعذر النسخ على هذا المتصفح'))}else toast('النسخ غير مدعوم هنا')}
function render(){progress.hidden=false;bar.style.width=Math.min(94,12+historyStack.length*9)+'%';const n=DB.nodes[current],r=DB.results[current];if(n){const choices=DB.options[current]||[];set('<div class="eyebrow">اختر الإجابة الأقرب لحالتك</div><h1 class="qtitle">'+esc(n.text)+'</h1><div class="options">'+choices.map(o=>'<button class="opt" data-next="'+esc(o.next_id)+'">'+esc(o.label)+'</button>').join('')+'</div><div class="nav"><button class="btn" id="prev">السابق</button><button class="btn" id="dash">لوحة التحكم</button></div>');screen.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{b.classList.add('selected');setTimeout(()=>go(b.dataset.next),120)});document.getElementById('prev').onclick=back;document.getElementById('dash').onclick=dashboard;return}if(r){bar.style.width='100%';const s=DB.sources[r.source_id]||null;const blocks=[['وضعك الآن',r.current_situation],['وش تسوي الآن؟',r.next_step],['وش تحتاج؟',r.requirements],['وش يصير بعد كذا؟',r.what_happens_next],['ملاحظة مهمة',r.lawyer_boundary]].filter(x=>x[1]);set('<div class="resultHead"><div class="eyebrow">'+esc(r.result_type||'النتيجة')+'</div><h1>هذه هي الخطوة الأقرب لحالتك</h1></div>'+blocks.map(x=>'<div class="section"><b>'+esc(x[0])+'</b><p>'+esc(x[1])+'</p></div>').join('')+(s&&s.url?'<a class="source" href="'+esc(s.url)+'" target="_blank" rel="noopener">فتح المصدر الرسمي — '+esc(s.authority||s.title)+'</a>':'')+'<div class="resultTools"><button class="btn" id="copy">نسخ ملخص النتيجة</button><button class="btn" id="dash">لوحة التحكم</button></div><div class="nav"><button class="btn" id="prev">السابق</button><button class="btn primary" id="again">ابدأ من جديد</button></div>');document.getElementById('prev').onclick=back;document.getElementById('again').onclick=()=>{clearSaved();start()};document.getElementById('dash').onclick=dashboard;document.getElementById('copy').onclick=()=>copyResult(r);return}set('<h1 class="qtitle">تعذر فتح هذا المسار</h1><button class="btn primary" id="dash">لوحة التحكم</button>');document.getElementById('dash').onclick=dashboard}
cover();
</script></body></html>
